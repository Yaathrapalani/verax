version: '3.8'

services:
  foulx-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: foulx-api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - ENVIRONMENT=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  foulx-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: foulx-frontend
    ports:
      - "3000:80"
    depends_on:
      foulx-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/index.html"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
